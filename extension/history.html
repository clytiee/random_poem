<!doctype html>
<html lang="zh-CN">
<head>

  <title>随机诗文 · 历史</title>
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>

    <div class="brand">历史</div>
