<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>随机诗文</title>
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="poem.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">随机诗文</div>
    <div class="top-actions">
      <button class="btn icon" data-act="prev" title="上一首">
        <svg viewBox="0 0 24 24"><path d="m10.5 3-8.5 9 8.5 9"/><path d="M21 12H3"/></svg>
      </button>
      <button class="btn" data-act="another">换一首</button>
      <button class="btn" data-act="note" hidden>赏析</button>
      <button class="btn icon" data-act="fav" title="收藏" data-on="false">
        <svg viewBox="0 0 24 24"><path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg>
      </button>
      <button class="btn icon" data-act="copy" title="复制全文">
        <svg viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>
      <button class="btn icon" data-act="shot" title="截图">
        <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </button>
      <button class="btn icon" data-act="history" title="历史">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="btn icon" data-act="settings" title="设置">
        <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="btn icon" data-act="layout" title="版式">
        <svg viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
      </button>
    </div>

    <div class="layout-panel" id="layout-panel" hidden>
      <div class="lp-head">版式</div>
      <label class="lp-row">
        <span>标题字号</span>
        <input id="lp-fs-title" type="number" min="10" max="72" step="1" placeholder="自动">
      </label>
      <label class="lp-row">
        <span>正文字号</span>
        <input id="lp-fs-body" type="number" min="10" max="56" step="1" placeholder="自动">
      </label>
      <label class="lp-row">
        <span>行高</span>
        <input id="lp-lh" type="number" min="1.2" max="3" step="0.1" placeholder="默认">
      </label>
      <label class="lp-row">
        <span>垂直对齐</span>
        <select id="lp-valign">
          <option value="start">靠上</option>
          <option value="center">居中</option>
        </select>
      </label>
      <label class="lp-row">
        <span>正文字体</span>
        <input id="lp-font-body" list="lp-fonts" placeholder="默认">
      </label>
      <label class="lp-row">
        <span>标题字体</span>
        <input id="lp-font-title" list="lp-fonts" placeholder="默认">
      </label>
      <datalist id="lp-fonts"></datalist>
      <div class="lp-foot">这里的改动会写入设置，与设置页共用。</div>
    </div>
  </header>

  <main class="stage">
    <div class="card" id="card" data-orient="v" data-size="m">
      <div class="paper"><div class="empty">载入中…</div></div>
    </div>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="poem.js"></script>
</body>
</html>
